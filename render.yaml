# Render Blueprint: New + -> Blueprint -> pick this repo. (web/dist is committed, so no Node build is needed.)
services:
  - type: web
    name: branch-cfo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ELEVENLABS_ADVISOR_AGENT_ID
        sync: false
      - key: ELEVENLABS_COLLECTOR_AGENT_ID
        sync: false
